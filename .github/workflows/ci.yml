name: CI

on:
  push:
    branches: [main, develop, "review/**"]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONUNBUFFERED: "1"

jobs:
  automation-quality:
    name: Automation quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip

      - name: Install quality tools
        run: |
          python -m pip install --upgrade pip
          pip install ruff==0.16.5 basedpyright

      - name: Ruff critical automation paths
        run: |
          ruff check \
            src/hh_applicant_tool/automation \
            scripts/reply_iterative_ai.py \
            scripts/check_ai.py \
            tests/test_reply_worker.py \
            tests/test_check_ai.py \
            --output-format=github

      - name: Ruff format critical automation paths
        run: |
          ruff format --check \
            src/hh_applicant_tool/automation \
            scripts/reply_iterative_ai.py \
            scripts/check_ai.py \
            tests/test_reply_worker.py \
            tests/test_check_ai.py

      - name: Type check automation layer
        run: basedpyright src/hh_applicant_tool/automation

      - name: Report legacy lint debt
        continue-on-error: true
        run: ruff check src/ tests/ scripts/ admin/ --statistics

      - name: Report legacy type debt
        continue-on-error: true
        run: basedpyright src/hh_applicant_tool

  tests:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13"]

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install project and test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install -r admin/requirements.txt
          pip install pytest pytest-cov

      - name: Run tests
        run: |
          pytest tests/ \
            --cov=src/hh_applicant_tool \
            --cov-report=term-missing \
            --cov-report=xml

      - name: Upload coverage
        if: matrix.python-version == '3.11'
        uses: codecov/codecov-action@v5
        with:
          files: ./coverage.xml
          fail_ci_if_error: false

  shellcheck:
    name: Shellcheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install shellcheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck
      - name: Check automation scripts
        run: |
          shellcheck \
            scripts/apply.sh \
            scripts/reply.sh \
            scripts/cron-job.sh \
            scripts/daily.sh \
            scripts/all-profiles.sh \
            scripts/setup-cron.sh \
            container-entrypoint.sh \
            startup.sh

  docker:
    name: Docker build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4.2.0
      - uses: docker/build-push-action@v7.3.0
        with:
          context: .
          file: ./Dockerfile
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
